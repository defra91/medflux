[project]
name = "carlino-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca De Franceschi", email = "luca.defranceschi.91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "click>=8.5.0",
    "cssselect2>=0.10.1",
    "jinja2>=3.1.6",
    "mypy>=2.3.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pyppeteer>=2.0.0",
    "ruff>=0.16.9",
    "tinycss2>=1.5.1",
    "weasyprint>=70.0",
]

[project.scripts]
carlino-db = "carlino_db:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import sorting
    "N",   # naming conventions
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]


[tool.black]
line-length = 120
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict = false
