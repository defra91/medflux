[project]
name = "carlino-db"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca De Franceschi", email = "luca.defranceschi.91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "cssselect2>=0.10.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pyppeteer>=2.0.0",
    "tinycss2>=1.5.1",
    "weasyprint>=70.0",
]

[project.scripts]
carlino-db = "carlino_db:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
